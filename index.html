<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RetrocubeX — Revive el píxel</title>
  <link rel="icon" href="assets/favicon-dark.png" media="(prefers-color-scheme: light)">
  <link rel="icon" href="assets/favicon-light.png" media="(prefers-color-scheme: dark)">
  <link rel="apple-touch-icon" href="assets/favicon-light.png">
  <link rel="stylesheet" href="colors_and_type.css">
  <link rel="stylesheet" href="kit.css">
  <link rel="stylesheet" href="landing.css">
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <script>
    (() => {
      const d=document,s=d.createElement("script");s.type="module";
      s.src="https://w.behold.so/widget.js";d.head.append(s);
    })();
  </script>
</head>
<body>

  <!-- ===== PRELOADER ===== -->
  <div class="preloader" id="preloader">
    <div class="pl-scan"></div>
    <div id="pl-inner">
      <img class="pl-logo" src="assets/logo-light.png" alt="RetroCubeX">
      <div class="pl-stage">
        <div class="pl-walker" id="pl-walker">
          <div class="inv-a" id="inv-a"></div>
          <div class="inv-b" id="inv-b"></div>
        </div>
        <div class="pl-track"><div class="pl-fill" id="pl-fill"></div></div>
      </div>
      <div class="pl-phrase" id="pl-phrase"></div>
    </div>
  </div>
  <div class="tv-bloom" id="tv-bloom"></div>
  <button class="pl-replay" id="pl-replay">▶ Repetir intro</button>

  <script>
  (function(){
    var PHRASES = [
      "SOPLANDO EL CARTUCHO…",
      "REBOBINANDO LA CINTA…",
      "INSERTANDO MONEDA…",
      "BUSCANDO UNA VIDA EXTRA…",
      "DESPERTANDO AL MARCIANO…",
      "PULIENDO CADA PÍXEL…",
      "MONTANDO TU DIORAMA…",
      "ENCENDIENDO LOS LEDS…",
      "ESQUIVANDO AL JEFE FINAL…",
      "SINTONIZANDO LA TELE…"
    ];
    var DONE_TEXT = "¡LISTO! ▶ PRESS START";

    // Sprite pixel-art (box-shadow)
    var UNIT = 5, MINT = "#54EEC0";
    var INV_A = ["..X.....X..","...X...X...","..XXXXXXX..",".XX.XXX.XX.","XXXXXXXXXXX","X.XXXXXXX.X","X.X.....X.X","...XX.XX..."];
    var INV_B = ["..X.....X..","X..X...X..X","X.XXXXXXX.X","XXX.XXX.XXX","XXXXXXXXXXX",".XXXXXXXXX.","..X.....X..",".X.......X."];
    function shadow(rows){
      var s=[];
      for(var y=0;y<rows.length;y++){var r=rows[y];
        for(var x=0;x<r.length;x++){if(r[x]!=='.'&&r[x]!==' ')s.push((x*UNIT)+"px "+(y*UNIT)+"px 0 "+MINT);}}
      return s.join(",");
    }
    var walker = document.getElementById('pl-walker');
    walker.style.width  = (11*UNIT)+"px";
    walker.style.height = (8*UNIT)+"px";
    document.getElementById('inv-a').style.boxShadow = shadow(INV_A);
    document.getElementById('inv-b').style.boxShadow = shadow(INV_B);

    var fill    = document.getElementById('pl-fill');
    var phraseEl= document.getElementById('pl-phrase');
    var overlay = document.getElementById('preloader');
    var inner   = document.getElementById('pl-inner');
    var bloom   = document.getElementById('tv-bloom');
    var replay  = document.getElementById('pl-replay');

    var phraseTimer=null, progTimer=null, exited=false;

    function setPct(p){ fill.style.width=p+"%"; walker.style.left=p+"%"; }

    function exit(){
      if(exited) return; exited=true;
      clearInterval(progTimer); clearInterval(phraseTimer);
      setPct(100); phraseEl.textContent=DONE_TEXT;
      setTimeout(function(){
        inner.classList.add('fade');
        setTimeout(function(){
          overlay.classList.add('tv-off');
          bloom.classList.add('flash');
          var root=document.getElementById('root');
          if(root) root.classList.add('rcx-reveal');
        },230);
        setTimeout(function(){
          overlay.classList.add('gone');
          replay.classList.add('show');
        },1160);
      },400);
    }

    function run(){
      exited=false;
      overlay.classList.remove('gone','tv-off');
      inner.classList.remove('fade');
      bloom.classList.remove('flash');
      var root=document.getElementById('root');
      if(root) root.classList.remove('rcx-reveal');
      replay.classList.remove('show');
      setPct(0);
      var pi=Math.floor(Math.random()*PHRASES.length);
      phraseEl.textContent=PHRASES[pi];
      clearInterval(phraseTimer); clearInterval(progTimer);
      phraseTimer=setInterval(function(){ pi=(pi+1)%PHRASES.length; phraseEl.textContent=PHRASES[pi]; },1250);
      var start=performance.now();
      progTimer=setInterval(function(){
        var e=performance.now()-start;
        var lin=e/3400;
        // Llega hasta el 90% y espera a que React avise
        if(lin>=0.9){ clearInterval(progTimer); setPct(90); return; }
        var eased=lin+Math.sin(lin*Math.PI*3)*0.012;
        setPct(Math.max(0,Math.min(90,Math.floor(eased*100))));
      },40);
    }

    replay.addEventListener('click', run);
    window.__plExit = exit;   // React lo llamará al montar
    run();
  })();
  </script>

  <div id="root"></div>
  <script type="text/babel" src="data.jsx"></script>
  <script type="text/babel" src="ui.jsx"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="heroes.jsx"></script>
  <script type="text/babel" src="sections.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>
</body>
</html>
